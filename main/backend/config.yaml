# ==============================================================================
# AI算法教育平台 — 后端主配置文件 (config.yaml)
# ==============================================================================

server:
  host: 0.0.0.0
  port: 8000
  debug: true

# ------------------------------------------------------------------------------
# 大语言模型 (LLM) 混合模式配置：以本地模型 (Ollama) 为主，外部 API 为辅
# ------------------------------------------------------------------------------
llm:
  backend: ollama                     # 默认主选: "ollama" (本地模型)，可热切换为 "api" (外部辅助 API)

  # 本地 Ollama 推理服务 (主选)
  ollama:
    base_url: http://localhost:11434
    model: deepseek-r1:7b             # 已就绪！微调后可更新为 qwen2.5-coder-custom:7b
    temperature: 0.7
    timeout: 60

  # 外部云端 API 服务 (辅助 / 备用兜底)
  api:
    provider: deepseek                # 支持 deepseek / openai / custom
    base_url: https://api.deepseek.com/v1
    api_key: sk-xxxxxxxxxxxxxxxxxxxx  # 可在此填入你的 DeepSeek / OpenAI API Key
    model: deepseek-chat
    temperature: 0.7
    max_tokens: 4096
    timeout: 60

# ------------------------------------------------------------------------------
# 向量 Embedding 模型配置 (BAAI/bge-m3 始终本地运行)
# ------------------------------------------------------------------------------
embedding:
  model_name: BAAI/bge-m3            # 本地中文高精度 Embedding 模型
  device: cpu                         # 有显卡可改为 cuda
  normalize_embeddings: true

# ------------------------------------------------------------------------------
# 向量数据库 (ChromaDB) 本地持久化配置
# ------------------------------------------------------------------------------
vectordb:
  type: chroma
  persist_directory: ./data/chroma_db
  collection_name: ai_algorithms

# ------------------------------------------------------------------------------
# RAG 检索管线超参数配置
# ------------------------------------------------------------------------------
rag:
  top_k: 5                            # 检索召回的前 5 个最相似切片
  chunk_size: 500                     # 单个文本块大小
  chunk_overlap: 50                   # 块间重叠大小
  similarity_threshold: 0.3

# ------------------------------------------------------------------------------
# 数据库与文档存储路径
# ------------------------------------------------------------------------------
database:
  db_path: ./data/history.db          # 对话与代码审查历史记录数据库

documents:
  upload_dir: ./data/documents        # 原始上传教材/讲义存储目录
