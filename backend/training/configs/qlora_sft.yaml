# Model and Stage Settings
model_name_or_path: deepseek-ai/DeepSeek-R1-Distill-Qwen-7B
stage: sft
do_train: true
finetuning_type: lora
quantization_bit: 4

# LoRA Parameters
lora_target: q_proj,v_proj,k_proj,o_proj,gate_proj,up_proj,down_proj
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.05

# Dataset and Output
dataset_dir: ../data
dataset: ai_edu_sft
template: deepseek
cutoff_len: 2048
output_dir: ../saves/deepseek-r1-qlora

# Hyperparameters
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 2.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
fp16: true

# Logging and Saving
logging_steps: 10
save_steps: 100
